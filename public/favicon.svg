<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e8a72"/>
      <stop offset="100%" stop-color="#104d41"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Scissors blades -->
  <!-- Top blade -->
  <line x1="20" y1="20" x2="44" y2="40" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom blade -->
  <line x1="20" y1="40" x2="44" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>

  <!-- Scissors pivot screw -->
  <circle cx="32" cy="30" r="3" fill="white" opacity="0.9"/>
  <circle cx="32" cy="30" r="1.5" fill="#176b59"/>

  <!-- Top handle ring -->
  <circle cx="16" cy="16" r="7" stroke="white" stroke-width="2.5" fill="none"/>
  <!-- Bottom handle ring -->
  <circle cx="16" cy="44" r="7" stroke="white" stroke-width="2.5" fill="none"/>

  <!-- Needle on the right side -->
  <line x1="48" y1="14" x2="44" y2="50" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="47.2" cy="16" rx="2.5" ry="1.5" transform="rotate(-10 47.2 16)" stroke="#a7f3d0" stroke-width="1.5" fill="none"/>
  <!-- Thread wave -->
  <path d="M44 50 Q42 54 46 56" stroke="#a7f3d0" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>