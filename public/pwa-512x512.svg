<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e8a72"/>
      <stop offset="100%" stop-color="#104d41"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Scissors blades -->
  <line x1="150" y1="150" x2="360" y2="310" stroke="white" stroke-width="24" stroke-linecap="round"/>
  <line x1="150" y1="310" x2="360" y2="150" stroke="white" stroke-width="24" stroke-linecap="round"/>

  <!-- Pivot -->
  <circle cx="255" cy="230" r="24" fill="white" opacity="0.95"/>
  <circle cx="255" cy="230" r="12" fill="#176b59"/>

  <!-- Top handle ring -->
  <circle cx="120" cy="118" r="58" stroke="white" stroke-width="20" fill="none"/>
  <!-- Bottom handle ring -->
  <circle cx="120" cy="344" r="58" stroke="white" stroke-width="20" fill="none"/>

  <!-- Needle -->
  <line x1="390" y1="104" x2="362" y2="400" stroke="#a7f3d0" stroke-width="17" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="386" cy="114" rx="18" ry="10" transform="rotate(-8 386 114)" stroke="#a7f3d0" stroke-width="12" fill="none"/>
  <!-- Thread -->
  <path d="M362 400 Q340 432 372 446" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
