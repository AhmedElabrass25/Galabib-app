<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e8a72"/>
      <stop offset="100%" stop-color="#104d41"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>

  <!-- Scissors blades -->
  <line x1="58" y1="58" x2="134" y2="118" stroke="white" stroke-width="9" stroke-linecap="round"/>
  <line x1="58" y1="118" x2="134" y2="58" stroke="white" stroke-width="9" stroke-linecap="round"/>

  <!-- Pivot -->
  <circle cx="96" cy="88" r="9" fill="white" opacity="0.95"/>
  <circle cx="96" cy="88" r="4.5" fill="#176b59"/>

  <!-- Top handle ring -->
  <circle cx="46" cy="46" r="22" stroke="white" stroke-width="8" fill="none"/>
  <!-- Bottom handle ring -->
  <circle cx="46" cy="130" r="22" stroke="white" stroke-width="8" fill="none"/>

  <!-- Needle -->
  <line x1="146" y1="40" x2="136" y2="150" stroke="#a7f3d0" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="144" cy="44" rx="7" ry="4" transform="rotate(-8 144 44)" stroke="#a7f3d0" stroke-width="4.5" fill="none"/>
  <!-- Thread -->
  <path d="M136 150 Q128 162 140 168" stroke="#a7f3d0" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>
