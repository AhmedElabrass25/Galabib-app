<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e8a72"/>
      <stop offset="100%" stop-color="#104d41"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- Scissors blades -->
  <line x1="54" y1="54" x2="126" y2="110" stroke="white" stroke-width="8.5" stroke-linecap="round"/>
  <line x1="54" y1="110" x2="126" y2="54" stroke="white" stroke-width="8.5" stroke-linecap="round"/>

  <!-- Pivot -->
  <circle cx="90" cy="82" r="8.5" fill="white" opacity="0.95"/>
  <circle cx="90" cy="82" r="4" fill="#176b59"/>

  <!-- Top handle ring -->
  <circle cx="42" cy="42" r="20" stroke="white" stroke-width="7.5" fill="none"/>
  <!-- Bottom handle ring -->
  <circle cx="42" cy="122" r="20" stroke="white" stroke-width="7.5" fill="none"/>

  <!-- Needle -->
  <line x1="137" y1="38" x2="128" y2="142" stroke="#a7f3d0" stroke-width="6" stroke-linecap="round"/>
  <!-- Needle eye -->
  <ellipse cx="135" cy="42" rx="6.5" ry="3.5" transform="rotate(-8 135 42)" stroke="#a7f3d0" stroke-width="4" fill="none"/>
  <!-- Thread -->
  <path d="M128 142 Q120 152 130 158" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
